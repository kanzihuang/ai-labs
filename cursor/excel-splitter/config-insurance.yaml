# 是否保留原格式（缺省 true。设为 false 可大幅提速，因为跳过逐单元格样式复制）
keep_style: true
# 每次写入行数（缺省 500。也用作进度输出间隔）
write_batch_size: 2
input:
  path: "input/计提及支付账户拆分配置材料.xlsx"
  sheet:
    source:
      name: "输入-社保表"
      columns:
        employee_id: "工号"
        project_id: "费用所属中心"
        project_category: "费用类别"
        project_hours: "实际出勤"
        payment_account: "支付账户"
        employer_name: "费用归属单位"
    reference:
      name: "输入-工时表"
      columns:
        employee_id: "工号"
        project_id: "费用所属中心"
        project_category: "费用类别"
        project_hours: "实际出勤"
    payment:
      name: "输入-支付规则"
      columns:
        project_id: "费用所属中心"
        payment_account: "支付账户"
        employer_name: "公司"
  splitting_columns:
  - "养老保险企业缴纳金额"
  - "养老保险个人缴纳金额"
  - "失业保险企业缴纳金额"
  - "失业保险个人缴纳金额"
  - "工伤保险缴费合计"
  - "生育保险缴费合计"
  - "医疗保险企业缴纳金额"
  - "医疗保险个人缴纳金额"
  - "公积金企业缴纳金额"
  - "公积金个人缴纳金额"
  - "残疾保障金企业金额"
  - "服务费"
  - "易才企业小计"
  - "北京企业小计"
  - "易才个人缴纳"
  - "北京个人小计"
  computed_columns:
    四险企业缴纳合计: "养老保险企业缴纳金额 + 失业保险企业缴纳金额 + 工伤保险缴费合计 + 生育保险缴费合计"
    四险个人缴纳合计: "养老保险个人缴纳金额 + 失业保险个人缴纳金额"
    五险企业缴纳合计: "四险企业缴纳合计 + 医疗保险企业缴纳金额"
    五险个人缴纳合计: "四险个人缴纳合计 + 医疗保险个人缴纳金额"
    企业缴纳合计: "五险企业缴纳合计 + 公积金企业缴纳金额 + 残疾保障金企业金额 + 服务费"
    个人缴纳合计: "五险个人缴纳合计 + 公积金个人缴纳金额"
    缴费合计: "企业缴纳合计 + 个人缴纳合计"
output:
  path: "output/社保拆分.xlsx"
  sheet:
    result:
      name: "社保拆分"
