# 是否保留原格式（缺省 true。设为 false 可大幅提速，因为跳过逐单元格样式复制）
keep_style: true
# 每次写入行数（缺省 500，值越大写入越快但内存占用越多。也用作进度输出间隔）
write_batch_size: 2
input:
  path: "input/项目成本.xlsx"  
  sheet:
    source:
      name: "输入-工资表"
      columns:
        employee_id: "工号"
        project_id: "费用所属中心"
        project_category: "费用类别"
        project_hours: "实际出勤"
        payment_account: "支付账户"
        employer_name: "工资所属单位"
    reference:
      name: "输入-工时表"
      columns:
        employee_id: "工号"
        project_id: "费用所属中心"
        project_category: "费用类别"
        project_hours: "实际出勤"
    payment:
      name: "输入-支付规则"
      columns:
        project_id: "费用所属中心"
        payment_account: "支付账户"
        employer_name: "公司"
  splitting_columns:
  - 基本工资
  - 岗位工资
output:
  path: "output/项目成本拆分.xlsx"
  sheet:
    result:
      name: "工资拆分"
