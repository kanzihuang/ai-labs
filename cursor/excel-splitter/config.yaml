# 是否保留原格式（缺省 true。设为 false 可大幅提速，因为跳过逐单元格样式复制）
keep_style: true
# 每次写入行数（缺省 500。也用作进度输出间隔）
write_batch_size: 2
input:
  path: "input/项目成本.xlsx"
  sheet:
    source:
      name: "输入-工资表"
      columns:
        employee_id: "工号"
        project_id: "费用所属中心"
        project_category: "费用类别"
        project_hours: "实际出勤"
        employer_name: "工资所属单位"
      null_check_columns:  # 可选：检测指定列的空值（None / 空字符串 / 纯空白），检测到即报错退出
        - 基本工资
        - 岗位工资
    reference:
      name: "输入-工时表"
      columns:
        employee_id: "工号"
        project_id: "费用所属中心"
        project_category: "费用类别"
        project_hours: "实际出勤"
      null_check_columns:  # 可选：检测指定列的空值
        - 实际出勤
    payment:
      name: "输入-支付规则"
      columns:
        project_id: "费用所属中心"
        employer_name: "公司"
        project_category: "费用类别"
      output_columns:
        - 支付账户
        - 开户行
      null_check_columns:  # 可选：检测指定列的空值
        - 支付账户
  splitting_columns:
  - 基本工资
  - 岗位工资
  - 用餐补助
  - 差旅补助
  computed_columns:
    福利前工资合计: "基本工资 + 岗位工资"
    税前应发工资总额(不含差补): "福利前工资合计 + 用餐补助"
    实发工资: "税前应发工资总额(不含差补) + 差旅补助"
output:
  path: "output/项目成本拆分.xlsx"
  sheet:
    result:
      name: "工资拆分"
