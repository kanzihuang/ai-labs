input:
  path: "input/项目成本.xlsx"  
  sheet:
    source:
      name: "输入-工资表"
      columns:
        employee_id: "工号"
        project_id: "费用所属中心"
        project_category: "费用类别"
        project_hours: "实际出勤"
        payment_account: "支付账户"
        employer_name: "工资所属单位"
    reference:
      name: "输入-工时表"
      columns:
        employee_id: "工号"
        project_id: "费用所属中心"
        project_category: "费用类别"
        project_hours: "实际出勤"
    payment:
      name: "输入-支付规则"
      columns:
        project_id: "费用所属中心"
        payment_account: "支付账户"
        employer_name: "公司"
  splitting_columns:
  - 基本工资
  - 岗位工资
# 每处理多少行输出一次进度（缺省 100，设为 1 则每行都输出）
progress_interval: 100
output:
  path: "output/项目成本拆分.xlsx"
  sheet:
    result:
      name: "工资拆分"
